apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-fundamentals
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kubernetes-fundamentals
  template:
    metadata:
      labels:
        app: kubernetes-fundamentals
    spec:
      containers:
        - name: api
          image: kubernetes-fundamentals:1.0
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 5000
